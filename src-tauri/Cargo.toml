[package]
name = "circle-browser"
version = "0.1.0"
description = "Ultra-fast, lightweight, privacy-first native desktop browser built with Tauri v2, Wry, and Rust"
authors = ["Circle Browser Team"]
edition = "2021"

[lib]
name = "circle_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
parking_lot = "0.12"
