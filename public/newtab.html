<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New tab</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 45%, #3a3a3a 0%, #303030 65%, #282828 100%);
      --search-bg: #222222;
      --search-border: rgba(255, 255, 255, 0.12);
      --search-border-focus: #3b82f6;
      --search-glow: rgba(59, 130, 246, 0.35);
      --text-main: #f4f4f5;
      --text-muted: #b0b0b5;
      --text-placeholder: #808085;
      --tile-bg: rgba(255, 255, 255, 0.06);
      --tile-hover: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background: var(--bg-gradient);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 15vh;
    }

    .canvas-container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Centered Floating Search Box */
    .search-box {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }

    .search-box:focus-within {
      background: #1c1c1c;
      border-color: var(--search-border-focus);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 0 2px var(--search-glow);
    }

    .search-icon {
      width: 18px;
      height: 18px;
      margin-right: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14.5px;
      letter-spacing: 0.15px;
      user-select: text;
      -webkit-user-select: text;
    }

    .search-input::placeholder {
      color: var(--text-placeholder);
    }

    /* Quick Site Shortcuts */
    .shortcuts-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .shortcut-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--tile-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 12.5px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }

    .shortcut-pill:hover {
      background: var(--tile-hover);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .shortcut-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <form class="search-box" id="search-form">
      <div class="search-icon">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      </div>

      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search the web"
        autofocus
        autocomplete="off"
        spellcheck="false"
      />
    </form>

    <!-- Quick Shortcuts Grid -->
    <div class="shortcuts-grid">
      <a class="shortcut-pill" href="https://www.google.com">
        <span class="shortcut-icon">🌐</span>
        <span>Google</span>
      </a>
      <a class="shortcut-pill" href="https://github.com">
        <span class="shortcut-icon">🐙</span>
        <span>GitHub</span>
      </a>
      <a class="shortcut-pill" href="https://youtube.com">
        <span class="shortcut-icon">▶</span>
        <span>YouTube</span>
      </a>
      <a class="shortcut-pill" href="https://wikipedia.org">
        <span class="shortcut-icon">📖</span>
        <span>Wikipedia</span>
      </a>
    </div>
  </div>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      const hasSpaces = query.includes(' ');
      const hasDot = query.includes('.');
      const isLocalhost = query.startsWith('localhost');

      if (!hasSpaces && (query.startsWith('http://') || query.startsWith('https://'))) {
        window.location.href = query;
      } else if (!hasSpaces && (hasDot || isLocalhost)) {
        window.location.href = 'https://' + query;
      } else {
        window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
      }
    });
  </script>
</body>
</html>
