<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New tab</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 85% 45%, #240542 0%, #0c0217 65%, #050009 100%);
      --search-bg: rgba(20, 20, 23, 0.85);
      --search-border: rgba(255, 255, 255, 0.08);
      --search-border-focus: rgba(99, 102, 241, 0.5);
      --search-glow: rgba(99, 102, 241, 0.2);
      --text-main: #f1f2f6;
      --text-placeholder: #75757f;
      --btn-hover: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background: var(--bg-gradient);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Top-right corner inside the page: Settings gear icon button (32x32px, semi-transparent) */
    .settings-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      z-index: 10;
    }

    .settings-btn:hover {
      background: var(--btn-hover);
      color: #ffffff;
    }

    /* Centered Search Box: ~120px from top toolbar */
    .search-viewport {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 120px;
    }

    .search-box {
      width: 90%;
      max-width: 580px;
      height: 46px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .search-box:focus-within {
      background: rgba(26, 26, 32, 0.95);
      border-color: var(--search-border-focus);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65), 0 0 0 2px var(--search-glow);
    }

    .google-icon {
      width: 18px;
      height: 18px;
      margin-right: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14.5px;
      letter-spacing: 0.15px;
      user-select: text;
      -webkit-user-select: text;
    }

    .search-input::placeholder {
      color: var(--text-placeholder);
    }
  </style>
</head>
<body>

  <!-- Top-right corner inside the page: Settings gear icon button (32x32px, semi-transparent) -->
  <button class="settings-btn" title="Customize Circle" aria-label="Settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <!-- Centered Search Box: ~120px from top toolbar, max-width 580px, width 90%, height: 46px -->
  <div class="search-viewport">
    <form class="search-box" id="search-form">
      <!-- Left Search Icon / Google 'G' icon (18x18px) -->
      <div class="google-icon">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      </div>

      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search the web"
        autofocus
        autocomplete="off"
        spellcheck="false"
      />
    </form>
  </div>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      const hasSpaces = query.includes(' ');
      const hasDot = query.includes('.');
      const isLocalhost = query.startsWith('localhost');

      if (!hasSpaces && (query.startsWith('http://') || query.startsWith('https://'))) {
        window.location.href = query;
      } else if (!hasSpaces && (hasDot || isLocalhost)) {
        window.location.href = 'https://' + query;
      } else {
        window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
      }
    });
  </script>
</body>
</html>
